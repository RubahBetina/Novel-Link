<script>

        // Load Pengaturan dari Admin localStorage

        const settings = JSON.parse(localStorage.getItem('novellink_settings')) || {

            siteTitle: "NovelLink",

            logoBase64: "",

            popupText: "Selamat datang pembaca di kumpulan novel milik NovelLink🥰🤗. Silakan pilih cerita mana yang kalian suka.",

            disclaimerText: "Seluruh isi konten, cerita, cover, serta file aplikasi yang terdapat di dalam situs web ini dilindungi oleh hak cipta. Dilarang keras untuk menyalin, mengunggah ulang, memperjualbelikan, atau mendistribusikan materi dari situs ini ke platform lain tanpa izin tertulis dari pemilik."

        };

        // Set Judul & Logo Website

        document.getElementById('headerTitle').innerText = settings.siteTitle || "NovelLink";

        if (settings.logoBase64) {

            const logoEl = document.getElementById('headerLogo');

            logoEl.src = settings.logoBase64;

            logoEl.style.display = 'block';

        }

        // Set Welcome Banner

        const bannerEl = document.getElementById('welcomeBanner');

        if (settings.popupText && settings.popupText.trim() !== "") {

            bannerEl.innerText = settings.popupText;

        } else {

            bannerEl.style.display = 'none';

        }

        // Set Disclaimer Peringatan

        document.getElementById('disclaimerContent').innerText = settings.disclaimerText;

        // Render Social Media Dinamis

        const defaultSocials = [

            { name: "WhatsApp", url: "https://wa.me/" },

            { name: "Instagram", url: "https://instagram.com/" }

        ];

        const socials = JSON.parse(localStorage.getItem('novellink_socials')) || defaultSocials;

        const socialGrid = document.getElementById('socialGridContainer');

        socialGrid.innerHTML = '';

        

        socials.forEach(s => {

            const a = document.createElement('a');

            a.href = s.url;

            a.target = "_blank";

            a.className = "social-btn";

            a.innerHTML = `🔗 ${s.name}`;

            socialGrid.appendChild(a);

        });

        function gantiTab(namaHalaman, tombol) {

            let pages = document.querySelectorAll('.page-content');

            pages.forEach(page => page.classList.remove('active'));

            let buttons = document.querySelectorAll('.nav-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById('page-' + namaHalaman).classList.add('active');

            tombol.classList.add('active');

        }

        function handleGlobalClick(event) {

            let banner = document.getElementById('welcomeBanner');

            let indicator = document.getElementById('bannerIndicator');

            let header = document.getElementById('mainHeader');

            let modal = document.getElementById('modalPopup');

            if (banner.style.display !== 'none' && !banner.classList.contains('collapsed')) {

                if (!header.contains(event.target) && !modal.classList.contains('active')) {

                    banner.classList.add('collapsed');

                    indicator.classList.add('visible');

                }

            }

        }

        function showBanner(event) {

            event.stopPropagation();

            let banner = document.getElementById('welcomeBanner');

            let indicator = document.getElementById('bannerIndicator');

            banner.classList.remove('collapsed');

            indicator.classList.remove('visible');

        }

        // Muat Daftar Novel dari localStorage Admin (Menggunakan metode Dataset agar aman dari error string)

        function muatNovel() {

            let defaultNovel = [

                {

                    title: "Jejak Langkah Waktu",

                    genre: "Fantasy / Mystery",

                    status: "Ongoing",

                    app: "Wattpad",

                    cover: "",

                    synopsis: "Seorang pemuda yang terbangun di masa depan dan harus mencari jalan pulang sebelum terjebak selamanya di dimensi gelap.",

                    link: "#"

                }

            ];

            let dataNovel = JSON.parse(localStorage.getItem('novellink_novels'));

            if (!dataNovel || dataNovel.length === 0) {

                dataNovel = defaultNovel;

                localStorage.setItem('novellink_novels', JSON.stringify(defaultNovel));

            }

            

            let containerOngoing = document.getElementById('rakOngoing');

            let containerTamat = document.getElementById('rakTamat');

            

            containerOngoing.innerHTML = '';

            containerTamat.innerHTML = '';

            dataNovel.forEach(novel => {

                let linkTarget = novel.link ? novel.link : "#";

                let coverImg = novel.cover ? novel.cover : 'https://via.placeholder.com/150x220/1e3a8a/00f2fe?text=Cover';

                

                let itemDiv = document.createElement('div');

                itemDiv.className = 'novel-item';

                let imgEl = document.createElement('img');

                imgEl.src = coverImg;

                imgEl.alt = "Cover";

                imgEl.className = 'novel-cover';

                

                // Menyimpan data menggunakan dataset (aman untuk gambar base64 besar maupun teks bergeser)

                imgEl.dataset.title = novel.title || "";

                imgEl.dataset.genre = novel.genre || "-";

                imgEl.dataset.app = novel.app || "-";

                imgEl.dataset.synopsis = novel.synopsis || "Deskripsi belum tersedia.";

                imgEl.dataset.link = linkTarget;

                // Event listener ketika cover diklik

                imgEl.addEventListener('click', function() {

                    bukaModal(

                        this.dataset.title,

                        this.dataset.genre,

                        this.dataset.app,

                        this.dataset.synopsis,

                        this.dataset.link

                    );

                });

                let pEl = document.createElement('p');

                pEl.className = 'novel-judul';

                pEl.innerText = novel.title;

                itemDiv.appendChild(imgEl);

                itemDiv.appendChild(pEl);

                if (novel.status && novel.status.toLowerCase() === 'completed') {

                    containerTamat.appendChild(itemDiv);

                } else {

                    containerOngoing.appendChild(itemDiv);

                }

            });

            if (containerOngoing.innerHTML === '') {

                containerOngoing.innerHTML = '<p style="color: #94a3b8; padding: 10px; width: 100%; text-align: center;">Belum ada novel ongoing.</p>';

            }

            if (containerTamat.innerHTML === '') {

                containerTamat.innerHTML = '<p style="color: #94a3b8; padding: 10px; width: 100%; text-align: center;">Belum ada novel tamat.</p>';

            }

        }

        function bukaModal(judul, genre, app, deskripsi, linkBaca) {

            document.getElementById('modalJudul').innerText = judul;

            document.getElementById('modalGenre').innerText = genre;

            document.getElementById('modalApp').innerText = app;

            document.getElementById('modalDeskripsi').innerText = deskripsi;

            document.getElementById('btnBaca').href = linkBaca;

            

            let modal = document.getElementById('modalPopup');

            modal.style.display = 'flex';

            setTimeout(() => {

                modal.classList.add('active');

            }, 10);

        }

        function tutupModal() {

            let modal = document.getElementById('modalPopup');

            modal.classList.remove('active');

            setTimeout(() => {

                modal.style.display = 'none';

            }, 300);

        }

        window.onload = muatNovel;

</script>
